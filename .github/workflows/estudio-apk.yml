name: APK do Estúdio

# Compila o app de administração (admin-app/) e publica o APK na release "estudio-apk".
on:
  push:
    branches: [main, "apk-*"]
    paths: ["admin-app/**", ".github/workflows/estudio-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estudio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund
      - name: Copiar o Capacitor para o app
        run: |
          f=$(ls node_modules/@capacitor/core/dist/capacitor.js 2>/dev/null || true)
          if [ -z "$f" ]; then echo "::error::capacitor.js não encontrado em @capacitor/core/dist: $(ls node_modules/@capacitor/core/dist | tr '\n' ' ')"; exit 1; fi
          cp "$f" www/capacitor.js
          echo "window.BM_VERSION = '1.${{ github.run_number }}';" > www/version.js
      - name: Gerar o projeto Android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx cap add android && node scripts/patch-android.mjs && npx cap sync android
      - name: Compilar
        working-directory: admin-app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log
      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "error:|\.java:[0-9]+|FAILURE|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Assinar
        env:
          KS_PASS: estudio-bm-2026
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks keystore/estudio.jks --ks-key-alias estudio --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out estudio-better-manga.apk aligned.apk
          "$BT/apksigner" verify estudio-better-manga.apk
          ls -la estudio-better-manga.apk
      - name: Publicar na release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete estudio-apk --yes --cleanup-tag || true
          gh release create estudio-apk estudio-better-manga.apk \
            --title "Estúdio Better Mangá — versão 1.${{ github.run_number }}" \
            --notes "APK de administração para publicar obras da MediocreScan no Better Mangá. Instale por cima da versão anterior." \
            --latest=false
